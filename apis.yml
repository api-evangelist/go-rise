aid: go-rise
name: Go Rise
description: >-
  Rise (gorise.co) is a Dubai-based fintech platform that gives migrant workers
  control over their finances across both their home and host countries. Through
  a mobile app for iOS and Android, Rise offers bank accounts, insurance, savings
  and investment options, "Pay Later" installment services, and remittance and
  money-transfer capabilities. The company partners with regulated financial
  institutions including United Arab Bank and insurance providers such as AXA
  Gulf, and is headquartered in DMCC, Jumeirah Lakes Towers, Dubai, UAE. Rise is
  a portfolio company of 500 Global and has raised funding led by MEVP. This is a
  consumer financial-services product with no public developer/API surface at the
  time of enrichment.
